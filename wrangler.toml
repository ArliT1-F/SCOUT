# Cloudflare deployment for the SCOUT public website.
#
# The website is a static Vite SPA: `npm run build` type-checks and builds it into `dist/`,
# which Cloudflare Workers serves as static assets at the domain's edge with HTTPS and automatic
# certificate management. Requests are handled by the Worker in `functions/worker.ts`, which
# answers `/api/*` (health probes, the `/api/beta/*` account proxy, the platform stub) and hands
# everything else to the static assets below — SPA fallback via `not_found_handling`, security
# headers via `public/_headers` (copied into `dist/` by Vite).
#
# Compatibility note: the SCOUT broadcast host (`server/index.ts`, `npm run dev` / `npm start`)
# and the hosted account service (`server/account-service.ts`) use node:sqlite, node:fs and a
# `ws` WebSocket server. None of those run on Cloudflare Workers, so they are deliberately NOT
# moved to Workers. The website talks to the account service through the worker's `/api/beta/*`
# proxy, which forwards server-to-server. The Node backend keeps running wherever the operator
# hosts it (same machine as the host, or a small VM/container).
# See docs/CLOUDFLARE.md and docs/ARCHITECTURE.md.

name = "scout"
compatibility_date = "2025-07-18"
main = "functions/worker.ts"

[build]
command = "npm run build"

[assets]
directory = "./dist"
# The worker hands non-API requests to the asset router via this binding.
binding = "ASSETS"
# Every request runs through the worker first (it answers /api/* and delegates the rest to
# ASSETS); paths without a static file serve the SPA shell, so client-side routes (/apply,
# /login, /download, /profile, /privacy) work after a reload.
not_found_handling = "single-page-application"
run_worker_first = true

# Worker production secrets (never in the client bundle; set with `wrangler secret put`):
#   SCOUT_ACCOUNT_SERVICE_URL  https://accounts.example.com   (Node.js account service)
#   SCOUT_BETA_API_KEY         service key for owner-only /api/beta/applications* routes

# Local development (no production credentials required):
#
#   1. Start the account service locally:
#      PORT=8790 HOST=127.0.0.1 SCOUT_ACCOUNT_BASE_URL=http://127.0.0.1:8790 \
#        npx tsx server/account-service.ts
#   2. Put the dev secrets in .dev.vars (gitignored):
#      SCOUT_ACCOUNT_SERVICE_URL=http://127.0.0.1:8790
#      SCOUT_BETA_API_KEY=dev-key-only
#   3. npx wrangler dev --ip 0.0.0.0 --port 3000
