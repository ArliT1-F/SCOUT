<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>SCOUT — A better broadcast for every CS2 tournament</title>
<link rel="preload" href="/fonts/dm-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin/>
<meta name="description" content="Turn one observer PC into a complete CS2 broadcast. Live overlays, nine scenes and one operator panel, built for community tournaments. Apply for the free closed beta."/>
<!-- Indexing and social defaults for the public shell. Private routes (sign-in, download, profile,
     the owner desk) set their own noindex via JS (src/site.tsx PAGE_META) and hold no account data
     in this document. Canonical is rewritten per route by the same map. -->
<meta name="robots" content="index, follow"/>
<link rel="canonical" href="/"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="SCOUT"/>
<meta property="og:title" content="SCOUT — A better broadcast for every CS2 tournament"/>
<meta property="og:description" content="Turn one observer PC into a complete CS2 broadcast. Live overlays, nine scenes and one operator panel, built for community tournaments. Apply for the free closed beta."/>
<meta property="og:image" content="/logo/scout-tile.png"/>
<meta property="og:image:alt" content="SCOUT"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="SCOUT — A better broadcast for every CS2 tournament"/>
<meta name="twitter:description" content="Turn one observer PC into a complete CS2 broadcast. Live overlays, nine scenes and one operator panel. Apply for the free closed beta."/>
<meta name="twitter:image" content="/logo/scout-tile.png"/>
<!-- The mark from src/logo.tsx and src-tauri/icons. The SVG is the source; the PNGs are what phones
     and older browsers ask for, and the tile is the same artwork as the desktop shortcut. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="alternate icon" href="/favicon.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#0b0a0d"/>
<meta name="color-scheme" content="dark"/>
<!-- The operator panel is an app you keep on a phone or tablet at the venue: allow full screen from
     the home screen, and let the panel's own layout deal with the notch (safe-area insets). -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SCOUT"/>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
