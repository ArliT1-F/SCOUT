<!doctype html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>SCOUT — Broadcast control</title>
<meta name="description" content="SCOUT — a CS2 broadcast overlay: external Game State Integration host, operator panel and transparent scoreboard HUD."/>
<!-- The mark from src/logo.tsx and src-tauri/icons. The SVG is the source; the PNGs are what phones
     and older browsers ask for, and the tile is the same artwork as the desktop shortcut. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="alternate icon" href="/favicon.png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="theme-color" content="#0b0a0d"/>
<meta name="color-scheme" content="dark"/>
<!-- The operator panel is an app you keep on a phone or tablet at the venue: allow full screen from
     the home screen, and let the panel's own layout deal with the notch (safe-area insets). -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SCOUT"/>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
